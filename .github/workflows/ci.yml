name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .
          uv run mypy
      - name: Tests
        run: uv run pytest -n auto --cov --cov-report=term-missing

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: astral-sh/setup-uv@v6 # the supervisor integration test runs the real engine
      - name: Engine environment
        working-directory: engine
        run: uv sync --frozen
      - name: Frontend dist placeholder
        run: New-Item -ItemType Directory -Force ../dist | Out-Null
        shell: pwsh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  installer:
    needs: [engine, ui, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # NSIS toolset + WebView2 bootstrapper that `tauri build` would otherwise download with a
      # short timeout. Verified on every run (hit or miss) by fetch-tauri-tools.ps1.
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('scripts/fetch-tauri-tools.ps1') }}
      - name: Fetch and verify Tauri bundler tools
        shell: pwsh
        run: ./scripts/fetch-tauri-tools.ps1
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-all.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
